name: CI Full Matrix

on:
  push:
    branches: [main]

concurrency:
  group: ci-full-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.os }}, ${{ matrix.node-version }}, shard=${{ matrix.test-shard }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Main-branch full matrix keeps OS/Node smoke coverage, while the
          # expensive Ubuntu/Node 20 Jest suite runs as three parallel shards.
          - os: ubuntu-latest
            node-version: 24
            test-shard: ''
          - os: ubuntu-latest
            node-version: 20
            test-shard: '1'
          - os: ubuntu-latest
            node-version: 20
            test-shard: '2'
          - os: ubuntu-latest
            node-version: 20
            test-shard: '3'
          - os: ubuntu-latest
            node-version: 22
            test-shard: ''
          - os: macos-latest
            node-version: 24
            test-shard: ''
          - os: macos-latest
            node-version: 20
            test-shard: ''
          - os: macos-latest
            node-version: 22
            test-shard: ''
          - os: windows-latest
            node-version: 24
            test-shard: ''
          - os: windows-latest
            node-version: 20
            test-shard: ''
          - os: windows-latest
            node-version: 22
            test-shard: ''

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Lint tier boundary (core must not import pilot)
        run: npm run lint:tier

      - name: Lint tool schemas (description / enum / REQUIRED-prefix budgets)
        run: npm run lint:tool-schemas
        # Baseline-aware: existing violations are allow-listed at
        # scripts/lint-tool-schemas.baseline.json; only NEW violations fail CI.
        # See docs/dev/tool-schema-conventions.md.

      - name: Check capability map is in sync
        run: npm run docs:capability-map:check

      - name: Run full tests shard ${{ matrix.test-shard }}/3
        if: matrix.test-shard != ''
        run: npx jest --config jest.ci.config.js --shard=${{ matrix.test-shard }}/3
        env:
          CI: true

      - name: Run smoke tests
        if: matrix.test-shard == ''
        run: npx jest --config jest.ci.config.js --runTestsByPath tests/cli/doctor/runtime-diagnostics.test.ts tests/scripts/gen-capability-map.test.ts
        env:
          CI: true
