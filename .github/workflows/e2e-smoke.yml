name: E2E PR Smoke

on:
  pull_request:
    branches: [main, develop]
    paths:
      - '.github/workflows/e2e*.yml'
      - 'cli/**'
      - 'src/**'
      - 'tests/e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsconfig.test.json'

concurrency:
  group: e2e-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      DEBUG: '1'
      OPENCHROME_E2E_SERVER_ARGS: '--server-mode'
      TIME_SCALE: '0.1'

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install Chrome
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: stable

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Capture environment
        run: |
          mkdir -p artifacts/e2e/pr-smoke
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            google-chrome --version || google-chrome-stable --version || true
          } > artifacts/e2e/pr-smoke/environment.txt

      - name: Run PR smoke
        run: |
          set -o pipefail
          npm run test:e2e:smoke -- \
            --json \
            --outputFile artifacts/e2e/pr-smoke/jest-results.json \
            2>&1 | tee artifacts/e2e/pr-smoke/jest.log

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-pr-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/e2e/pr-smoke/
          if-no-files-found: warn
          retention-days: 7
