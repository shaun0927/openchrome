name: local fixture basic navigation
vars:
  base_url: http://127.0.0.1:8765
steps:
  - navigate:
      url: ${base_url}/index.html
  - assert:
      contract:
        kind: dom_text
        selector: h1
        contains: Playbook Fixture Home
      evidence:
        snapshot:
          url: ${base_url}/index.html
          dom_text:
            h1: Playbook Fixture Home
  - assert:
      contract:
        kind: dom_text
        selector: "#details"
        contains: Details fixture reached successfully.
      evidence:
        snapshot:
          url: ${base_url}/index.html
          dom_text:
            "#details": Details fixture reached successfully.
